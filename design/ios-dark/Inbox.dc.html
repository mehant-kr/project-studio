<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pindrop · Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #000000; color: #ffffff; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 17px; letter-spacing: -0.01em">
  <div style="height: 100%; overflow-y: auto; padding: 54px 0 110px; box-sizing: border-box">
    <nav style="display: flex; align-items: center; justify-content: flex-end; height: 44px; padding: 0 12px">
      <sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><button onClick="{{markAll}}" style="height: 44px; border: 0; background: transparent; color: #7d7aff; font: 17px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; padding: 0 6px">Mark All Read</button></sc-if>
    </nav>
    <header style="padding: 2px 20px 0">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">Inbox</h1>
      <p style="margin: 2px 0 0; font-size: 15px; color: rgba(235, 235, 245, 0.6)">{{subtitle}}</p>
    </header>
    <div role="group" aria-label="Show" style="margin: 14px 16px 0; padding: 2px; border-radius: 9px; background: #1c1c1e; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
        <button onClick="{{tb.pick}}" aria-pressed="{{tb.on}}" style="height: 30px; border: 0; border-radius: 7px; background: {{tb.bg}}; color: #ffffff; font: 600 13px -apple-system, Inter, system-ui, sans-serif">{{tb.name}}</button>
      </sc-for>
    </div>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <section>
        <h2 style="margin: 22px 36px 8px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: rgba(235, 235, 245, 0.6)">{{s.name}}</h2>
        <div style="margin: 0 16px; background: #1c1c1e; border-radius: 12px; overflow: hidden">
          <sc-for list="{{s.items}}" as="n" hint-placeholder-count="2">
            <a href="Detail.dc.html" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 12px 8px; border-bottom: {{n.sep}}">
              <span style="width: 10px; flex-shrink: 0; padding-top: 14px; display: flex; justify-content: center"><sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}"><span aria-label="Unread" style="width: 9px; height: 9px; border-radius: 5px; background: #0a84ff"></span></sc-if></span>
              <span style="width: 36px; height: 36px; border-radius: 18px; background: {{n.bg}}; color: {{n.fg}}; display: grid; place-items: center; flex-shrink: 0">
                <sc-if value="{{n.isAlarm}}" hint-placeholder-val="{{true}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg></sc-if>
                <sc-if value="{{n.isCal}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></sc-if>
                <sc-if value="{{n.isCloud}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></sc-if>
                <sc-if value="{{n.isList}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="display: flex; align-items: baseline; gap: 8px"><span style="flex: 1; font-weight: {{n.weight}}">{{n.title}}</span><span style="font-size: 15px; color: rgba(235, 235, 245, 0.6); flex-shrink: 0">{{n.when}}</span></span>
                <span style="font-size: 15px; color: rgba(235, 235, 245, 0.6); line-height: 1.35">{{n.body}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 14px; right: 90px; bottom: 26px; height: 66px; padding: 5px; box-sizing: border-box; border-radius: 33px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)), rgba(30, 30, 32, 0.55); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(255, 255, 255, 0.06), 0 12px 30px rgba(0, 0, 0, 0.55)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Today</a>
    <a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>My Tasks</a>
    <a href="Projects.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Projects</a>
    <a href="Inbox.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: #ffffff; font-size: 10px; font-weight: 600; background: radial-gradient(120% 100% at 30% 15%, rgba(130, 145, 255, 0.24), rgba(255, 255, 255, 0.07) 65%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.08); position: relative"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox<sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: -3px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #ff453a; color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; text-align: center">{{unread}}</span></sc-if></a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </nav>
  <a href="QuickAdd.dc.html" aria-label="New task" style="position: absolute; right: 14px; bottom: 26px; width: 66px; height: 66px; border-radius: 33px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.03)), rgba(94, 92, 230, 0.62); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -2px 6px rgba(0, 0, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.55), 0 6px 20px rgba(94, 92, 230, 0.35)"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.4" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', allRead: false };
  }
  renderVals() {
    const look = {
      alarm: ['rgba(255, 69, 58, 0.2)', '#ff6961'],
      cal: ['rgba(125, 122, 255, 0.2)', '#a9a7ff'],
      cloud: ['rgba(10, 132, 255, 0.2)', '#64b5ff'],
      list: ['rgba(48, 209, 88, 0.18)', '#30d158'],
    };
    const all = [
      { sec: 'Today', kind: 'reminder', icon: 'alarm', title: 'Due today', body: 'Split Utility Bills · Personal, 6:00 PM', when: '9:00 AM', unread: true },
      { sec: 'Today', kind: 'reminder', icon: 'alarm', title: 'Overdue', body: 'Return library books was due yesterday', when: '9:00 AM', unread: true },
      { sec: 'Today', kind: 'update', icon: 'cloud', title: 'Synced from your Mac', body: '3 tasks changed in Reinforcement Learning', when: '8:12 AM', unread: false },
      { sec: 'Earlier', kind: 'reminder', icon: 'cal', title: 'Coming up', body: 'Study Quiz 2 is due today', when: 'Yesterday', unread: false },
      { sec: 'Earlier', kind: 'update', icon: 'list', title: 'Your week', body: '6 tasks done, 8 open across 3 projects', when: 'Sun', unread: false },
    ];
    const s = this.state;
    const shown = all.filter(n => s.tab === 'all' || n.kind === s.tab);
    const sections = ['Today', 'Earlier']
      .map(name => {
        const items = shown.filter(n => n.sec === name);
        return {
          name,
          items: items.map((n, i) => {
            const unread = n.unread && !s.allRead;
            return {
              ...n,
              unread,
              weight: unread ? '600' : '400',
              bg: look[n.icon][0],
              fg: look[n.icon][1],
              isAlarm: n.icon === 'alarm',
              isCal: n.icon === 'cal',
              isCloud: n.icon === 'cloud',
              isList: n.icon === 'list',
              sep: i < items.length - 1 ? '1px solid #38383a' : '0',
            };
          }),
        };
      })
      .filter(sec => sec.items.length);
    const unread = s.allRead ? 0 : all.filter(n => n.unread).length;
    const tabs = [['all', 'All'], ['reminder', 'Reminders'], ['update', 'Updates']].map(([id, name]) => ({
      name,
      on: s.tab === id,
      bg: s.tab === id ? '#636366' : 'transparent',
      pick: () => this.setState({ tab: id }),
    }));
    return {
      sections,
      tabs,
      unread,
      hasUnread: unread > 0,
      subtitle: unread ? unread + ' unread' : 'All caught up',
      markAll: () => this.setState({ allRead: true }),
    };
  }
}
</script>
</body>
</html>
