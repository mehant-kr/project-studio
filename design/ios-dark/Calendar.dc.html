<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pindrop · Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #000000; color: #ffffff; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 17px; letter-spacing: -0.01em">
  <div style="height: 100%; overflow-y: auto; padding: 54px 0 120px; box-sizing: border-box">
    <nav style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 4px">
      <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; color: #7d7aff"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Today</a>
      <span style="display: flex">
        <button onClick="{{goToday}}" style="height: 44px; border: 0; background: transparent; color: #7d7aff; font: 17px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; padding: 0 8px">Today</button>
        <button aria-label="Search" style="width: 44px; height: 44px; border: 0; background: transparent; color: #7d7aff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      </span>
    </nav>
    <header style="padding: 2px 20px 0">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">October <span style="color: rgba(235, 235, 245, 0.6); font-weight: 600">2026</span></h1>
    </header>
    <div role="group" aria-label="View" style="margin: 12px 16px 0; padding: 2px; border-radius: 9px; background: #1c1c1e; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <a href="Calendar.dc.html" aria-current="page" style="height: 30px; border-radius: 7px; background: #636366; display: grid; place-items: center; font: 600 13px -apple-system, Inter, system-ui, sans-serif">Calendar</a>
      <a href="Timeline.dc.html" style="height: 30px; border-radius: 7px; display: grid; place-items: center; font: 600 13px -apple-system, Inter, system-ui, sans-serif">Timeline</a>
    </div>

    <div style="margin: 14px 12px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 13px; font-weight: 600; color: rgba(235, 235, 245, 0.6)">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div style="margin: 6px 12px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; border-bottom: 1px solid #38383a; padding-bottom: 10px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span aria-hidden="true"></span></sc-if>
        <sc-if value="{{c.isDay}}" hint-placeholder-val="{{true}}">
          <button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.selected}}" style="height: 48px; border: 0; background: transparent; color: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding-top: 4px">
            <span style="width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font: {{c.weight}} 19px -apple-system, Inter, system-ui, sans-serif; background: {{c.bg}}; color: {{c.fg}}">{{c.n}}</span>
            <span style="display: flex; gap: 3px; height: 5px">
              <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="1"><span style="width: 5px; height: 5px; border-radius: 3px; background: {{d}}"></span></sc-for>
            </span>
          </button>
        </sc-if>
      </sc-for>
    </div>

    <h2 style="margin: 18px 20px 8px; font-size: 15px; font-weight: 600; color: {{dayColor}}">{{dayTitle}}</h2>
    <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
      <div style="margin: 0 16px; background: #1c1c1e; border-radius: 12px; overflow: hidden">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
          <a href="Detail.dc.html" style="display: flex; align-items: stretch; gap: 12px; padding: 0 14px; min-height: 58px; border-bottom: {{it.sep}}">
            <span style="width: 58px; flex-shrink: 0; display: flex; align-items: center; font-size: 15px; color: rgba(235, 235, 245, 0.6)">{{it.time}}</span>
            <span style="width: 4px; border-radius: 2px; margin: 10px 0; background: {{it.color}}; flex-shrink: 0"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="color: {{it.titleColor}}">{{it.title}}</span><span style="font-size: 15px; color: rgba(235, 235, 245, 0.6)">{{it.project}}</span></span>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 6px 20px 0; color: rgba(235, 235, 245, 0.6)">Nothing scheduled. Tap + to plan something for this day.</p>
    </sc-if>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 14px; right: 90px; bottom: 26px; height: 66px; padding: 5px; box-sizing: border-box; border-radius: 33px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)), rgba(30, 30, 32, 0.55); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(255, 255, 255, 0.06), 0 12px 30px rgba(0, 0, 0, 0.55)">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: #ffffff; font-size: 10px; font-weight: 600; background: radial-gradient(120% 100% at 30% 15%, rgba(130, 145, 255, 0.24), rgba(255, 255, 255, 0.07) 65%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.08)"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Today</a>
    <a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>My Tasks</a>
    <a href="Projects.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Projects</a>
    <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500; position: relative"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox<span style="position: absolute; top: 2px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #ff453a; color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; text-align: center">2</span></a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </nav>
  <a href="QuickAdd.dc.html" aria-label="New task" style="position: absolute; right: 14px; bottom: 26px; width: 66px; height: 66px; border-radius: 33px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.03)), rgba(94, 92, 230, 0.62); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -2px 6px rgba(0, 0, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.55), 0 6px 20px rgba(94, 92, 230, 0.35)"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.4" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 19 };
  }
  renderVals() {
    const P = { per: ['Personal', '#ff9f0a'], rl: ['Reinforcement Learning', '#7d7aff'], web: ['Portfolio Website', '#0a84ff'] };
    const byDay = {
      14: [['All day', 'Design refresh kickoff', 'web']],
      16: [['All day', 'Start Quiz 2 review', 'rl']],
      18: [['All day', 'Return library books', 'per', true]],
      19: [['All day', 'Study Quiz 2', 'rl'], ['6:00 PM', 'Split Utility Bills', 'per']],
      20: [['All day', 'Split Costco Bill', 'per'], ['All day', 'Read PPO paper', 'rl']],
      21: [['10:00 AM', 'Get OPT picture done', 'per'], ['All day', 'Build case studies', 'web']],
      23: [['11:59 PM', 'Problem set 3', 'rl']],
      26: [['All day', 'Final project proposal', 'rl']],
      28: [['All day', 'Renew renter’s insurance', 'per']],
    };
    const TODAY = 19, sel = this.state.day;
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const cells = [];
    for (let i = 0; i < 4; i++) cells.push({ blank: true, isDay: false });
    for (let n = 1; n <= 31; n++) {
      const isToday = n === TODAY, isSel = n === sel;
      cells.push({
        blank: false, isDay: true, n,
        selected: isSel,
        label: 'October ' + n + ((byDay[n] || []).length ? ', ' + byDay[n].length + ' scheduled' : ''),
        bg: isSel ? (isToday ? '#5e5ce6' : '#ffffff') : 'transparent',
        fg: isSel ? (isToday ? '#ffffff' : '#000000') : isToday ? '#a9a7ff' : n < TODAY ? 'rgba(235, 235, 245, 0.6)' : '#ffffff',
        weight: isToday || isSel ? '600' : '400',
        dots: [...new Set((byDay[n] || []).map(e => P[e[2]][1]))].slice(0, 3),
        pick: () => this.setState({ day: n }),
      });
    }
    const list = byDay[sel] || [];
    const dow = days[(sel + 3) % 7];
    return {
      cells,
      dayTitle: (sel === TODAY ? 'Today · ' : '') + dow + ', October ' + sel,
      dayColor: sel === TODAY ? '#a9a7ff' : '#ffffff',
      hasItems: list.length > 0,
      empty: list.length === 0,
      items: list.map((e, i) => ({
        time: e[0], title: e[1], project: P[e[2]][0], color: P[e[2]][1],
        titleColor: e[3] ? '#ff6961' : '#ffffff',
        sep: i < list.length - 1 ? '1px solid #38383a' : '0',
      })),
      goToday: () => this.setState({ day: TODAY }),
    };
  }
}
</script>
</body>
</html>
