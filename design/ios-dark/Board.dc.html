<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pindrop · Personal board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #000000; color: #ffffff; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 17px; letter-spacing: -0.01em; display: flex; flex-direction: column">
  <header style="padding-top: 54px; flex-shrink: 0">
    <nav style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px; padding: 0 8px 0 4px">
      <a href="Projects.dc.html" style="height: 44px; display: flex; align-items: center; color: #7d7aff; justify-self: start"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Projects</a>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 3px; background: #ff9f0a"></span>Personal</h1>
      <a href="Menu.dc.html" aria-label="Project actions" style="justify-self: end; width: 44px; height: 44px; display: grid; place-items: center"><span style="width: 30px; height: 30px; border-radius: 15px; background: #2c2c2e; color: #7d7aff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke-width: 2.4" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span></a>
    </nav>
    <div role="group" aria-label="View" style="margin: 4px 16px 0; padding: 2px; border-radius: 9px; background: #1c1c1e; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <button onClick="{{showBoard}}" aria-pressed="{{isBoard}}" style="height: 30px; border: 0; border-radius: 7px; background: {{boardBg}}; color: #ffffff; font: 600 13px -apple-system, Inter, system-ui, sans-serif">Board</button>
      <button onClick="{{showList}}" aria-pressed="{{isList}}" style="height: 30px; border: 0; border-radius: 7px; background: {{listBg}}; color: #ffffff; font: 600 13px -apple-system, Inter, system-ui, sans-serif">List</button>
    </div>
  </header>

  <sc-if value="{{isBoard}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; min-height: 0; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 16px 16px 100px; box-sizing: border-box">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="2">
        <section aria-label="{{c.name}}" style="flex: 0 0 300px; scroll-snap-align: center; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0 4px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{c.c}}"></span>{{c.name}}<span style="color: rgba(235, 235, 245, 0.6); font-weight: 500">{{c.count}}</span></h2>
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
            <a href="Detail.dc.html" style="background: #1c1c1e; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-weight: 500; line-height: 1.3; color: {{k.titleColor}}; text-decoration: {{k.strike}}">{{k.title}}</span>
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="padding: 2px 8px; border-radius: 6px; background: {{k.lbg}}; color: {{k.lfg}}; font-size: 13px; font-weight: 500">{{k.label}}</span>
                <span style="flex: 1"></span>
                <sc-if value="{{k.flag}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 15px; height: 15px; color: #ff9f0a; fill: #ff9f0a" role="img" aria-label="Flagged"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg></sc-if>
                <span style="font-size: 13px; font-weight: 500; color: {{k.dueColor}}">{{k.due}}</span>
              </span>
            </a>
          </sc-for>
          <a href="QuickAdd.dc.html" style="min-height: 44px; border-radius: 12px; border: 1px dashed #48484a; color: #7d7aff; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add Task</a>
        </section>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 100px; box-sizing: border-box">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="2">
        <section>
          <h2 style="margin: 20px 20px 8px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: rgba(235, 235, 245, 0.6)">{{c.name}} · {{c.count}}</h2>
          <div style="background: #1c1c1e; border-radius: 12px; overflow: hidden">
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
              <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-bottom: 1px solid #38383a">
                <span style="flex: 1; color: {{k.titleColor}}; text-decoration: {{k.strike}}">{{k.title}}</span>
                <span style="font-size: 15px; color: {{k.dueColor}}">{{k.due}}</span>
              </a>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </sc-if>

  <nav aria-label="Tabs" style="position: absolute; left: 14px; right: 90px; bottom: 26px; height: 66px; padding: 5px; box-sizing: border-box; border-radius: 33px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)), rgba(30, 30, 32, 0.55); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(255, 255, 255, 0.06), 0 12px 30px rgba(0, 0, 0, 0.55)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Today</a>
    <a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>My Tasks</a>
    <a href="Projects.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: #ffffff; font-size: 10px; font-weight: 600; background: radial-gradient(120% 100% at 30% 15%, rgba(130, 145, 255, 0.24), rgba(255, 255, 255, 0.07) 65%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.08)"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Projects</a>
    <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500; position: relative"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox<span style="position: absolute; top: -3px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #ff453a; color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; text-align: center">2</span></a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </nav>
  <a href="QuickAdd.dc.html" aria-label="New task" style="position: absolute; right: 14px; bottom: 26px; width: 66px; height: 66px; border-radius: 33px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.03)), rgba(94, 92, 230, 0.62); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -2px 6px rgba(0, 0, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.55), 0 6px 20px rgba(94, 92, 230, 0.35)"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.4" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'board' };
  }
  renderVals() {
    const L = { Bills: ['rgba(255, 159, 10, 0.18)', '#ffb340'], Errands: ['rgba(10, 132, 255, 0.2)', '#64b5ff'], Docs: ['rgba(191, 90, 242, 0.2)', '#d48cff'] };
    const sec = 'rgba(235, 235, 245, 0.6)';
    const card = (title, label, due, opt = {}) => ({
      title, label, due, flag: !!opt.flag,
      lbg: L[label][0], lfg: L[label][1],
      dueColor: opt.late ? '#ff6961' : opt.today ? '#a9a7ff' : sec,
      titleColor: opt.done ? sec : '#ffffff',
      strike: opt.done ? 'line-through' : 'none',
    });
    const cols = [
      { name: 'To Do', c: '#64d2ff', cards: [
        card('Split Utility Bills', 'Bills', 'Today', { flag: true, today: true }),
        card('Split Costco Bill', 'Bills', 'Tomorrow', { flag: true }),
        card('Get OPT picture done', 'Docs', 'Wed'),
      ] },
      { name: 'In Progress', c: '#ff9f0a', cards: [
        card('Return library books', 'Errands', 'Yesterday', { late: true }),
        card('Renew renter’s insurance', 'Docs', 'Oct 28'),
      ] },
      { name: 'Done', c: '#30d158', cards: [card('Set up autopay', 'Bills', 'Oct 14', { done: true })] },
    ].map(c => ({ ...c, count: c.cards.length }));
    const isBoard = this.state.view === 'board';
    return {
      cols,
      isBoard,
      isList: !isBoard,
      boardBg: isBoard ? '#636366' : 'transparent',
      listBg: isBoard ? 'transparent' : '#636366',
      showBoard: () => this.setState({ view: 'board' }),
      showList: () => this.setState({ view: 'list' }),
    };
  }
}
</script>
</body>
</html>
