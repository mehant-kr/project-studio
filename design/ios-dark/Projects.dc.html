<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pindrop · Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #000000; color: #ffffff; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 17px; letter-spacing: -0.01em">
  <div style="height: 100%; overflow-y: auto; padding: 54px 0 110px; box-sizing: border-box">
    <nav style="display: flex; align-items: center; justify-content: flex-end; height: 44px; padding: 0 8px">
      <button aria-label="New project" style="width: 44px; height: 44px; border: 0; background: transparent; color: #7d7aff; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </nav>
    <header style="padding: 2px 20px 0">
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.01em">Projects</h1>
    </header>
    <label style="margin: 10px 16px 0; height: 36px; border-radius: 10px; background: #1c1c1e; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: #98989f">
      <svg class="ic" viewBox="0 0 24 24" style="width: 17px; height: 17px" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search projects</span>
      <input placeholder="Search" style="flex: 1; border: 0; background: transparent; color: #ffffff; font: 17px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; outline: none">
    </label>

    <h2 style="margin: 24px 36px 8px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: rgba(235, 235, 245, 0.6)">Active</h2>
    <div style="margin: 0 16px; background: #1c1c1e; border-radius: 12px; overflow: hidden">
      <sc-for list="{{active}}" as="p" hint-placeholder-count="3">
        <a href="Board.dc.html" style="display: flex; align-items: center; gap: 12px; padding-left: 16px; min-height: 64px">
          <span style="width: 34px; height: 34px; border-radius: 9px; background: {{p.color}}; color: {{p.iconFg}}; display: grid; place-items: center; flex-shrink: 0">
            <sc-if value="{{p.isHeart}}" hint-placeholder-val="{{true}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></sc-if>
            <sc-if value="{{p.isBook}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></sc-if>
            <sc-if value="{{p.isGlobe}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></sc-if>
          </span>
          <span style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 10px; padding-right: 12px; border-bottom: {{p.sep}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{p.name}}</span><span style="font-size: 15px; color: rgba(235, 235, 245, 0.6)">{{p.meta}}</span></span>
            <svg viewBox="0 0 28 28" style="width: 28px; height: 28px; transform: rotate(-90deg)" role="img" aria-label="{{p.pctLabel}}"><circle cx="14" cy="14" r="11" fill="none" stroke="#38383a" stroke-width="3"/><circle cx="14" cy="14" r="11" fill="none" stroke="{{p.ring}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{p.dash}}"/></svg>
            <svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: rgba(235, 235, 245, 0.3)" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </a>
      </sc-for>
    </div>
    <p style="margin: 8px 36px 0; font-size: 13px; color: rgba(235, 235, 245, 0.6)">Rings show the share of each project's tasks that are done.</p>

    <h2 style="margin: 24px 36px 8px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: rgba(235, 235, 245, 0.6)">Completed</h2>
    <div style="margin: 0 16px; background: #1c1c1e; border-radius: 12px; overflow: hidden">
      <a href="Board.dc.html" style="display: flex; align-items: center; gap: 12px; padding-left: 16px; min-height: 52px">
        <span style="width: 34px; height: 34px; border-radius: 9px; background: #30d158; color: #000; display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px; stroke-width: 2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span style="flex: 1; display: flex; align-items: center; padding-right: 12px; gap: 8px"><span style="flex: 1">Move Apartment</span><span style="font-size: 15px; color: rgba(235, 235, 245, 0.6)">Sep 30</span><svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: rgba(235, 235, 245, 0.3)" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
    </div>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 14px; right: 90px; bottom: 26px; height: 66px; padding: 5px; box-sizing: border-box; border-radius: 33px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)), rgba(30, 30, 32, 0.55); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(255, 255, 255, 0.06), 0 12px 30px rgba(0, 0, 0, 0.55)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Today</a>
    <a href="Tasks.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>My Tasks</a>
    <a href="Projects.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: #ffffff; font-size: 10px; font-weight: 600; background: radial-gradient(120% 100% at 30% 15%, rgba(130, 145, 255, 0.24), rgba(255, 255, 255, 0.07) 65%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 1px rgba(255, 255, 255, 0.08)"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Projects</a>
    <a href="Inbox.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500; position: relative"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox<span style="position: absolute; top: -3px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #ff453a; color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; text-align: center">2</span></a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; justify-content: center; border-radius: 28px; color: rgba(255, 255, 255, 0.86); font-size: 10px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" style="width: 26px; height: 26px" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Settings</a>
  </nav>
  <a href="QuickAdd.dc.html" aria-label="New task" style="position: absolute; right: 14px; bottom: 26px; width: 66px; height: 66px; border-radius: 33px; display: grid; place-items: center; color: #ffffff; background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.03)), rgba(94, 92, 230, 0.62); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -2px 6px rgba(0, 0, 0, 0.18), 0 12px 30px rgba(0, 0, 0, 0.55), 0 6px 20px rgba(94, 92, 230, 0.35)"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 2.4" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 2 * Math.PI * 11;
    const list = [
      { name: 'Personal', meta: '5 open · 1 done', pct: 17, color: '#ff9f0a', iconFg: '#000', icon: 'heart' },
      { name: 'Reinforcement Learning', meta: '3 open · due Dec 12', pct: 40, color: '#5e5ce6', iconFg: '#fff', icon: 'book' },
      { name: 'Portfolio Website', meta: '8 open · due Nov 15', pct: 62, color: '#0a84ff', iconFg: '#fff', icon: 'globe' },
    ];
    return {
      active: list.map((p, i) => ({
        ...p,
        isHeart: p.icon === 'heart',
        isBook: p.icon === 'book',
        isGlobe: p.icon === 'globe',
        ring: p.color,
        dash: ((p.pct / 100) * C).toFixed(1) + ' ' + C.toFixed(1),
        pctLabel: p.pct + '% done',
        sep: i < list.length - 1 ? '1px solid #38383a' : '0',
      })),
    };
  }
}
</script>
</body>
</html>
