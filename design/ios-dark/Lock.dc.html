<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pindrop · Lock Screen reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.glyph{background:#fff;-webkit-mask:url(/_blob/5466e34693106c77428f4f3e22d65573) center/contain no-repeat;mask:url(/_blob/5466e34693106c77428f4f3e22d65573) center/contain no-repeat}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: #0b0b12; color: #ffffff; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 17px; letter-spacing: -0.01em">
  <div style="padding-top: 92px; text-align: center">
    <p style="margin: 0; font-size: 20px; font-weight: 600; color: rgba(255, 255, 255, 0.85)">Monday, October 19</p>
    <p style="margin: 0; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -0.02em">9:00</p>
  </div>

  <a href="Main.dc.html" style="margin: 14px auto 0; width: 170px; height: 70px; border-radius: 18px; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box">
    <svg viewBox="0 0 36 36" style="width: 36px; height: 36px; transform: rotate(-90deg); flex-shrink: 0" role="img" aria-label="1 of 4 tasks done today"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="23.6 94.2"/></svg>
    <span style="display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0"><span style="font-size: 15px; font-weight: 600">3 due today</span><span style="font-size: 13px; color: rgba(255, 255, 255, 0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Next: Utility Bills</span></span>
  </a>

  <section aria-label="Notifications" style="position: absolute; left: 10px; right: 10px; bottom: 150px">
    <button onClick="{{toggle}}" aria-expanded="{{open}}" style="width: 100%; border: 0; text-align: left; color: #ffffff; font: inherit; background: rgba(44, 44, 46, 0.82); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 22px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
      <span style="width: 38px; height: 38px; border-radius: 9px; background: #000; border: 1px solid #38383a; box-sizing: border-box; display: grid; place-items: center; flex-shrink: 0"><span class="glyph" style="width: 24px; height: 24px"></span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="display: flex; justify-content: space-between; font-size: 15px"><b style="font-weight: 600">Split Utility Bills</b><span style="color: rgba(235, 235, 245, 0.6)">now</span></span>
        <span style="font-size: 15px; line-height: 1.3">Due today at 6:00 PM · Personal</span>
        <span style="font-size: 13px; color: rgba(235, 235, 245, 0.6); margin-top: 2px">{{hint}}</span>
      </span>
    </button>
    <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 8px; background: rgba(44, 44, 46, 0.82); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 16px; overflow: hidden">
        <a href="Tasks.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border-bottom: 0.5px solid #48484a">Complete<svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></a>
        <a href="Tasks.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border-bottom: 0.5px solid #48484a">Snooze 1 Hour<svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg></a>
        <a href="Detail.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px">Open Task<svg class="ic" viewBox="0 0 24 24" style="width: 19px; height: 19px" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></a>
      </div>
    </sc-if>
  </section>

  <div aria-hidden="true" style="position: absolute; left: 46px; right: 46px; bottom: 50px; display: flex; justify-content: space-between">
    <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(255, 255, 255, 0.14); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" style="width: 22px; height: 22px" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
    <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(255, 255, 255, 0.14); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" style="width: 22px; height: 22px" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/></svg></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }
  renderVals() {
    const open = this.state.open;
    return {
      open,
      hint: open ? 'Choose an action' : 'Tap for actions',
      toggle: () => this.setState({ open: !this.state.open }),
    };
  }
}
</script>
</body>
</html>
