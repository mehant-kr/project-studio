class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }
  renderVals() {
    const list = [
      { id: 'a', title: 'Split Utility Bills', meta: 'Personal · Today, 6:00 PM', metaColor: '#ff6961', flag: true },
      { id: 'b', title: 'Study Quiz 2', meta: 'Reinforcement Learning · Today', metaColor: 'rgba(235, 235, 245, 0.6)' },
      { id: 'c', title: 'Split Costco Bill', meta: 'Personal · Tomorrow', metaColor: 'rgba(235, 235, 245, 0.6)', flag: true },
      { id: 'd', title: 'Get OPT picture done', meta: 'Personal · Wed', metaColor: 'rgba(235, 235, 245, 0.6)' },
    ];
    const done = this.state.done;
    return {
      tasks: list.map((t, i) => {
        const d = !!done[t.id];
        return {
          ...t,
          done: d,
          open: !d,
          ring: t.flag ? '#ff9f0a' : '#636366',
          color: d ? 'rgba(235, 235, 245, 0.6)' : '#ffffff',
          strike: d ? 'line-through' : 'none',
          flag: !!t.flag && !d,
          sep: i < list.length - 1 ? '1px solid #38383a' : '0',
          label: (d ? 'Mark not done: ' : 'Complete: ') + t.title,
          toggle: () => this.setState({ done: { ...this.state.done, [t.id]: !this.state.done[t.id] } }),
        };
      }),
    };
  }
}
